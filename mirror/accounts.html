<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Claude · 账号管理</title><style>*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:#f7f5f0;color:#34332e;margin:0}main{max-width:720px;margin:64px auto;padding:0 24px}h1{font-family:Georgia,"Songti SC",serif;font-weight:400;font-size:34px}.desc{color:#8b8379;font-size:14px;line-height:1.8}.card,form{background:white;border:1px solid #e2ddd3;border-radius:16px;padding:22px;margin:18px 0}.row{display:flex;align-items:center;gap:10px}.name{flex:1;font-weight:550}.tag{color:#b36649;font-size:12px}button,a{font:inherit;cursor:pointer}button{border:0;border-radius:9px;padding:10px 14px;background:#b36649;color:white;font-size:13px}.plain{background:transparent;color:#8b8379;padding:8px}input{width:100%;font:inherit;border:1px solid #e2ddd3;border-radius:9px;padding:13px;margin:8px 0}label{font-size:13px;display:block;margin-top:10px}h2{font-size:18px;font-weight:500;margin:0 0 16px}.small{font-size:12px;color:#91887d;line-height:1.8}.error{color:#b34a36;font-size:13px;min-height:18px}.bar{display:flex;justify-content:space-between;align-items:center}a{color:#b36649;text-decoration:none}button:disabled{opacity:.5}@media(max-width:500px){main{margin:32px auto}.row{flex-wrap:wrap}.name{min-width:50%}}</style><main><div class="bar"><a href="/mirror/resume">← 返回 Claude</a><button class="plain" id="lock">退出站点</button></div><h1>你的 Claude 账号。</h1><p class="desc">保存账号，一键切换。浏览器记住上次选择，下次打开直接进入。</p><div id="list"></div><div class="error" id="error"></div><form id="add"><h2>添加账号</h2><label>账号名称<input id="name" placeholder="例如：个人账号、工作账号" maxlength="40"></label><label>Claude sessionKey<input id="key" type="password" placeholder="粘贴这个账号的 sessionKey" autocomplete="off" required></label><p class="small">在 Claude 官网登录对应账号，在浏览器开发者工具的 Cookies 中复制 sessionKey。凭证只保存在这台服务器，账号列表不会显示凭证。</p><button id="save">验证并保存</button></form><p class="small">这里保存的是网页登录会话。若会话过期或被官网撤销，需要添加新的会话凭证。所有保存的账号共用本站访问密码。</p></main><script>let csrf='',current='',accounts=[];const $=id=>document.getElementById(id);async function api(p,data){let r=await fetch(p,{method:data?'POST':'GET',headers:{'Content-Type':'application/json','X-Mirror-CSRF':csrf},body:data?JSON.stringify(data):undefined});if(r.status===401){location.href='/login';throw Error('请重新登录')}if(r.redirected||!r.headers.get('content-type')?.includes('application/json')){throw Error('服务器未返回正确结果，请刷新页面；若登录已过期，请重新输入站点密码')}let j=await r.json();if(!r.ok)throw Error(j.error||'请求失败');return j}function error(e){$('error').textContent=e.message}async function load(){let j=await api('/mirror/state');csrf=j.csrf;current=j.selected;accounts=j.accounts;$('list').replaceChildren();for(let a of accounts){let card=document.createElement('div');card.className='card';let row=document.createElement('div');row.className='row';let name=document.createElement('span');name.className='name';name.textContent=a.name;row.append(name);if(a.id===current){let tag=document.createElement('span');tag.className='tag';tag.textContent='当前账号';row.append(tag)}let go=document.createElement('button');go.textContent=a.id===current?'进入聊天':'切换';go.onclick=async()=>{go.disabled=true;try{let j=await api('/mirror/switch',{id:a.id});location.href=j.next}catch(e){error(e);go.disabled=false}};let rename=document.createElement('button');rename.className='plain';rename.textContent='改名';rename.onclick=()=>{if(card.querySelector('.rename-form'))return;let edit=document.createElement('form');edit.className='rename-form';edit.style.cssText='margin:14px 0 0;padding:0;border:0';let label=document.createElement('label');label.textContent='修改账号名称';let input=document.createElement('input');input.value=a.name;input.maxLength=40;input.required=true;input.setAttribute('aria-label','修改账号名称');label.append(input);let save=document.createElement('button');save.type='submit';save.textContent='保存名称';let cancel=document.createElement('button');cancel.type='button';cancel.className='plain';cancel.textContent='取消';cancel.onclick=()=>edit.remove();edit.append(label,save,cancel);edit.onsubmit=async e=>{e.preventDefault();let n=input.value.trim();if(!n){input.setCustomValidity('请输入账号名称');input.reportValidity();return}save.disabled=true;$('error').textContent='';try{await api('/mirror/rename',{id:a.id,name:n});await load();$('error').textContent='名称已保存'}catch(e){error(e);save.disabled=false}};input.oninput=()=>input.setCustomValidity('');card.append(edit);input.focus();input.select()};row.append(go,rename);if(accounts.length>1){let del=document.createElement('button');del.className='plain';del.textContent='移除';del.onclick=async()=>{if(confirm('只移除本站保存的 '+a.name+'，不删除 Claude 官网账号或聊天记录。继续？')){try{await api('/mirror/remove',{id:a.id});load()}catch(e){error(e)}}};row.append(del)}card.append(row);$('list').append(card)}}$('add').onsubmit=async e=>{e.preventDefault();$('save').disabled=true;$('error').textContent='';try{await api('/mirror/add',{name:$('name').value,sessionKey:$('key').value});$('key').value='';$('name').value='';await load()}catch(e){error(e)}finally{$('save').disabled=false}};$('lock').onclick=async()=>{try{let j=await api('/mirror/lock',{});location.href=j.next}catch(e){error(e)}};load().catch(error)</script></html>
